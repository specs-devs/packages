name: FriendFinder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_OPTIMIZATION_LEVEL: -Onone
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "" # Replace with your Apple Developer Team ID
    PRODUCT_BUNDLE_IDENTIFIER: com.example.friendfinder
    INFOPLIST_FILE: FriendFinder/Info.plist
    CODE_SIGN_ENTITLEMENTS: FriendFinder/FriendFinder.entitlements
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/Frameworks"

packages:
  SpectaclesKit:
    path: SpectaclesKit
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "150.0.0"

targets:
  FriendFinder:
    type: application
    platform: iOS
    sources:
      - path: FriendFinder
    dependencies:
      - package: SpectaclesKit
        product: SpectaclesKit
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_NAME: FriendFinder

schemes:
  FriendFinder:
    build:
      targets:
        FriendFinder: all
    run:
      config: Debug
